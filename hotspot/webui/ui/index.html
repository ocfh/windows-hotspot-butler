<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi 热点管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="titlebar pywebview-drag-region">
  <div class="brand"><span class="logo">📡</span><span>WiFi 热点管理器</span></div>
  <div class="tb-right">
    <span id="adminBadge" class="badge">—</span>
    <button id="btnTheme" class="icon-btn" title="切换浅色/深色">🌙</button>
    <button id="btnStats" class="icon-btn" title="统计">📊</button>
    <button id="btnTools" class="icon-btn" title="工具箱">🧰</button>
    <button id="btnPortal" class="icon-btn" title="强制门户">🌐</button>
    <button id="btnMini" class="icon-btn" title="迷你悬浮窗">🎟️</button>
    <button id="btnSettings" class="icon-btn" title="设置">⚙️</button>
    <button id="btnMin" class="icon-btn" title="最小化">─</button>
    <button id="btnClose" class="icon-btn danger" title="关闭">✕</button>
  </div>
</header>

<main class="layout">

  <!-- ================= 左侧：开关与状态 ================= -->
  <section class="panel left">
    <div class="dial-wrap">
      <div id="dial" class="dial">
        <svg viewBox="0 0 240 240">
          <defs>
            <linearGradient id="gradOn" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3fb950"/>
              <stop offset="55%" stop-color="#58A6FF"/>
              <stop offset="100%" stop-color="#a371f7"/>
            </linearGradient>
            <linearGradient id="gradOff" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#39404d"/>
              <stop offset="100%" stop-color="#2a3140"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="120" cy="120" r="98"/>
          <circle id="ring" class="ring" cx="120" cy="120" r="98" transform="rotate(-90 120 120)"/>
        </svg>
        <div class="dial-inner">
          <div id="dialEmoji" class="dial-emoji">📡</div>
          <div id="dialText" class="dial-text">点击开启</div>
          <div id="dialSub" class="dial-sub">未运行</div>
        </div>
      </div>
    </div>

    <div class="status-line">
      <span id="statusPill" class="pill">未开启</span>
      <span id="autoStopText" class="muted small hidden"></span>
      <span id="uptimeText" class="muted small"></span>
      <span id="backendText" class="muted small"></span>
    </div>

    <div class="cred-card">
      <div class="cred-row">
        <span class="cred-k">名称</span>
        <span id="ssidText" class="cred-v">—</span>
        <button id="copySsid" class="mini" title="复制">📋</button>
      </div>
      <div class="cred-div"></div>
      <div class="cred-row">
        <span class="cred-k">密码</span>
        <span id="passText" class="cred-v mono">••••••••</span>
        <button id="btnQr" class="mini" title="扫码连接">🔗</button>
        <button id="togglePass" class="mini" title="显示/隐藏">👁</button>
        <button id="copyPass" class="mini" title="复制">📋</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-v" id="statOnline">0</div>
        <div class="stat-k">在线</div>
      </div>
      <div class="stat">
        <div class="stat-v down" id="statDown">0 B/s</div>
        <div class="stat-k">下行</div>
      </div>
      <div class="stat">
        <div class="stat-v up" id="statUp">0 B/s</div>
        <div class="stat-k">上行</div>
      </div>
    </div>

    <div id="warnBanner" class="banner hidden"></div>
  </section>

  <!-- ================= 右侧：设备列表 ================= -->
  <section class="panel right">
    <div class="right-head">
      <h2>设备 <span id="devCount" class="chip">0</span></h2>
      <div class="right-actions">
        <span id="portalChip" class="chip chip-soft hidden">门户 未启动</span>
        <button id="btnDiag" class="mini" title="诊断">🩺</button>
        <button id="btnRefresh" class="mini" title="刷新">🔄</button>
      </div>
    </div>
    <div id="deviceList" class="device-list">
      <div class="dev skeleton"><div class="sk-emoji"></div><div class="sk-lines"><span></span><span></span></div></div>
      <div class="dev skeleton"><div class="sk-emoji"></div><div class="sk-lines"><span></span><span></span></div></div>
      <div class="dev skeleton"><div class="sk-emoji"></div><div class="sk-lines"><span></span><span></span></div></div>
    </div>
    <div id="emptyState" class="empty hidden">
      <div class="empty-emoji">📶</div>
      <div class="empty-text">开启热点后，已连接的设备会显示在这里</div>
    </div>
  </section>
</main>

<div id="devMenu" class="menu hidden">
  <div class="menu-head" id="menuTitle">设备</div>
  <button class="menu-item" data-act="rename">✏️ 重命名</button>
  <div class="menu-sub">设备类型</div>
  <div id="emojiRow" class="emoji-row"></div>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="block" id="menuBlock">🚫 禁止上网</button>
  <button class="menu-item" data-act="portal" id="menuPortal">🌐 放行门户</button>
  <button class="menu-item danger" data-act="forget">🗑️ 移除设备</button>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>⚙️ 设置</h3><button class="icon-btn" data-close="settingsModal">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>热点名称</label>
        <input id="cfgSsid" type="text" maxlength="32" placeholder="MyHotspot">
      </div>
      <div class="field">
        <label>密码（至少 8 位）</label>
        <input id="cfgPass" type="text" maxlength="63" placeholder="12345678">
      </div>
      <div class="field-row">
        <div class="field">
          <label>频段</label>
          <select id="cfgBand">
            <option value="auto">自动</option>
            <option value="2.4">2.4 GHz</option>
            <option value="5">5 GHz</option>
          </select>
        </div>
        <div class="field">
          <label>控制后端</label>
          <select id="cfgBackend">
            <option value="auto">自动选择</option>
            <option value="winrt">移动热点 (WinRT)</option>
            <option value="netsh">承载网络 (netsh)</option>
          </select>
        </div>
      </div>
      <label class="switch-row">
        <input id="cfgAutoStart" type="checkbox" class="switch">
        <span>启动时自动开启热点</span>
      </label>
      <label class="switch-row">
        <input id="cfgStartWin" type="checkbox" class="switch">
        <span>开机自启</span>
      </label>
      <label class="switch-row">
        <input id="cfgCloseTray" type="checkbox" class="switch">
        <span>关闭时最小化到托盘</span>
      </label>
      <label class="switch-row">
        <input id="cfgConfirmExit" type="checkbox" class="switch">
        <span>退出时热点开启中 → 提醒确认</span>
      </label>
      <div class="field-row">
        <div class="field">
          <label>⏳ 临时密码（到期自动恢复原密码）</label>
          <div class="field-row">
            <select id="cfgTempHours" style="flex:1">
              <option value="1">1 小时</option>
              <option value="2">2 小时</option>
              <option value="4">4 小时</option>
              <option value="8">8 小时</option>
              <option value="24">24 小时</option>
            </select>
            <button id="btnTempPw" class="btn primary">生成</button>
            <button id="btnTempStop" class="btn ghost">取消</button>
          </div>
          <div id="tempPwHint" class="hint hidden"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>💾 配置备份</label>
          <div class="modal-foot" style="justify-content:flex-start">
            <button id="btnExport" class="btn ghost">导出配置</button>
            <button id="btnImport" class="btn ghost">导入配置</button>
          </div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>定时关闭（分钟，0=取消）</label>
          <select id="cfgAutoStop">
            <option value="0">不定时</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
            <option value="120">2 小时</option>
          </select>
        </div>
        <div class="field">
          <label>　</label>
          <button id="btnAutoStop" class="btn ghost">应用定时</button>
        </div>
      </div>
      <div class="modal-foot">
        <button id="btnApply" class="btn ghost">立即下发配置</button>
        <button id="btnSave" class="btn primary">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="portalModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>🌐 强制门户</h3><button class="icon-btn" data-close="portalModal">✕</button></div>
    <div class="modal-body">
      <label class="switch-row">
        <input id="pfEnabled" type="checkbox" class="switch">
        <span>开启强制门户（连上先看欢迎页，同意后放行）</span>
      </label>
      <label class="switch-row">
        <input id="pfDns" type="checkbox" class="switch">
        <span>DNS 劫持（设备自动弹出门户页）</span>
      </label>
      <div class="field-row">
        <div class="field">
          <label>页面模板</label>
          <select id="pfTemplate">
            <option value="aurora">极光</option>
            <option value="ocean">海风</option>
            <option value="corporate">商务</option>
            <option value="minimal">极简</option>
          </select>
        </div>
        <div class="field">
          <label>按钮文字</label>
          <input id="pfButton" type="text" placeholder="同意并开始上网">
        </div>
      </div>
      <div class="field">
        <label>标题</label>
        <input id="pfTitle" type="text" placeholder="欢迎接入 {{ssid}}">
      </div>
      <div class="field">
        <label>须知</label>
        <textarea id="pfNotice" rows="3" placeholder="使用须知，每行一条"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>访问密码（空=不需要）</label>
          <input id="pfPassword" type="text" placeholder="访客需输入此密码才能看到欢迎页">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>放行时段开始</label>
          <select id="pfSchStart"></select>
        </div>
        <div class="field">
          <label>放行时段结束</label>
          <select id="pfSchEnd"></select>
        </div>
      </div>
      <div id="pfStatus" class="hint"></div>
      <div class="modal-foot">
        <button id="btnPfSave" class="btn ghost">保存</button>
        <button id="btnPfStop" class="btn ghost">停止</button>
        <button id="btnPfStart" class="btn primary">启动</button>
      </div>
    </div>
  </div>
</div>

<div id="diagModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>🩺 诊断</h3><button class="icon-btn" data-close="diagModal">✕</button></div>
    <div class="modal-body">
      <pre id="diagText" class="diag">正在收集…</pre>
    </div>
  </div>
</div>

<div id="promptModal" class="modal hidden">
  <div class="modal-card small">
    <div class="modal-head"><h3 id="promptTitle">输入</h3><button class="icon-btn" data-close="promptModal">✕</button></div>
    <div class="modal-body">
      <input id="promptInput" type="text" class="full">
      <div class="modal-foot">
        <button id="promptCancel" class="btn ghost">取消</button>
        <button id="promptOk" class="btn primary">确定</button>
      </div>
    </div>
  </div>
</div>

<!-- WiFi 二维码 -->
<div id="qrModal" class="modal hidden">
  <div class="modal-card small">
    <div class="modal-head"><h3>🔗 扫码连接</h3><button class="icon-btn" data-close="qrModal">✕</button></div>
    <div class="modal-body" style="align-items:center;text-align:center">
      <img id="qrImage" alt="WiFi 二维码" style="width:220px;height:220px;border-radius:12px;background:#fff;padding:8px">
      <div class="hint">手机相机扫码即可连接，无需输入密码</div>
    </div>
  </div>
</div>

<div id="statsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>📊 流量统计</h3><button class="icon-btn" data-close="statsModal">✕</button></div>
    <div class="modal-body">
      <div class="stat-row" style="margin-bottom:10px">
        <div class="stat"><div class="stat-v" id="stTotal">—</div><div class="stat-k">累计</div></div>
        <div class="stat"><div class="stat-v down" id="stRx">—</div><div class="stat-k">接收</div></div>
        <div class="stat"><div class="stat-v up" id="stTx">—</div><div class="stat-k">发送</div></div>
      </div>
      <div class="field"><label>每日流量</label>
        <div id="statDaily" class="bar-chart"></div>
      </div>
      <div class="field"><label>流量 TOP 设备</label>
        <div id="statTop" class="top-list"></div>
      </div>
      <div class="field"><label>域名排行</label>
        <div id="statDomains" class="top-list"></div>
      </div>
      <div class="field"><label>最近 DNS 访问</label>
        <div id="statQueries" class="query-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="toolsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3>🧰 工具箱</h3><button class="icon-btn" data-close="toolsModal">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>📤 文件共享（手机浏览器直接互传文件）</label>
        <div class="hint" id="shareStatus">未启动</div>
        <div class="modal-foot" style="justify-content:flex-start">
          <button id="btnShareStart" class="btn primary">启动</button>
          <button id="btnShareStop" class="btn ghost">停止</button>
          <button id="btnShareFolder" class="btn ghost">打开共享目录</button>
        </div>
      </div>
      <div class="field">
        <label>🎮 端口转发（TCP）</label>
        <div class="field-row">
          <input id="pfName" type="text" placeholder="名称" style="max-width:110px">
          <input id="pfLPort" type="number" placeholder="本机端口" style="max-width:100px">
          <input id="pfIp" type="text" placeholder="设备 IP" style="max-width:120px">
          <input id="pfCPort" type="number" placeholder="设备端口" style="max-width:100px">
          <button id="btnPfAdd" class="btn primary">添加</button>
        </div>
        <div id="pfList" class="top-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="exitModal" class="modal hidden">
  <div class="modal-card small">
    <div class="modal-head"><h3>⚠️ 热点仍在运行</h3><button class="icon-btn" data-close="exitModal">✕</button></div>
    <div class="modal-body" style="text-align:center">
      <div class="hint" style="margin-bottom:14px">热点开启中，退出后设备将无法上网。确定退出吗？</div>
      <div class="modal-foot" style="justify-content:center">
        <button id="btnExitCancel" class="btn ghost">返回</button>
        <button id="btnExitOk" class="btn primary">确认退出</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="app.js"></script>
</body>
</html>
