<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{
  width:190px;height:64px;overflow:hidden;border-radius:16px;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#eaf0ff;
  background:linear-gradient(135deg,rgba(17,21,31,.96),rgba(28,35,54,.96));
  border:1px solid rgba(88,166,255,.28);
  box-shadow:0 12px 34px rgba(0,0,0,.55);
  display:flex;align-items:center;padding:0 12px;gap:10px;cursor:default;
}
body.on{border-color:rgba(63,185,80,.4)}
.sig{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center}
.sig svg{width:34px;height:34px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
body.on .ring{border-top-color:#3fb950;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{flex:1;min-width:0;line-height:1.35}
.row1{display:flex;align-items:baseline;gap:5px}
.n{font-size:19px;font-weight:700;color:#58A6FF}
.nlabel{font-size:10.5px;color:#8b949e}
.rates{font-size:10.5px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rates b{color:#79C0FF;font-weight:600}
.hint{font-size:9.5px;color:#6e7681;text-align:center;margin-top:1px}
</style>
</head>
<body>
  <div class="sig">
    <svg viewBox="0 0 24 24" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round">
      <path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.4a6 6 0 0 1 7 0"/>
      <circle cx="12" cy="20" r="1.3" fill="#58A6FF" stroke="none"/>
    </svg>
    <div class="ring"></div>
  </div>
  <div class="info">
    <div class="row1"><span class="n" id="n">0</span><span class="nlabel">台在线</span></div>
    <div class="rates" id="rates">↓ 0 B/s · ↑ 0 B/s</div>
  </div>
  <div class="hint">双击开关<br>右键返回</div>
<script>
const fmt = (n) => {
  let f = n, u = "B";
  for (const x of ["KB","MB","GB"]) { if (f < 1024) break; f /= 1024; u = x; }
  return (f < 10 && u !== "B" ? f.toFixed(1) : Math.round(f)) + " " + u;
};
async function tick() {
  try {
    const st = await window.pywebview.api.mini_state();
    document.body.classList.toggle("on", !!st.active);
    document.getElementById("n").textContent = st.online || 0;
    document.getElementById("rates").textContent =
      "↓ " + fmt(st.down || 0) + " · ↑ " + fmt(st.up || 0);
  } catch (e) {}
  setTimeout(tick, 1500);
}
document.addEventListener("dblclick", () => window.pywebview.api.mini_toggle());
document.addEventListener("contextmenu", (e) => { e.preventDefault(); window.pywebview.api.mini_restore_main(); });
window.addEventListener("pywebviewready", tick);
</script>
</body>
</html>
