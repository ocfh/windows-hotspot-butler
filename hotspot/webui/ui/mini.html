<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 色键透明（app.py）：WebView2 底色=alpha 0 + Form TransparencyKey 抠色，
     html/body 不铺底色（透明），只有 body 圆角内的渐变会画出来。 -->
<!-- 交互：左=WiFi 图标，单击切换热点开关；右=展开按钮，单击回主界面。
     拖拽：自实现 mousedown/mousemove，用 chrome.webview HTTP 打点不可靠，
     改走后端 move_mini(dx,dy) 增量移动（后端持有窗口引用，绝对可靠）。 -->
<style>
:root{
  --text:#eaf0ff;--muted:#8b949e;--n:#58A6FF;--accent:#58A6FF;--bg1:#11151f;--bg2:#1c2336;
  --green:#3fb950;
}
html[data-theme="light"]{
  --text:#1c2333;--muted:#5d6a7e;--n:#2f6fed;--accent:#2f6fed;--bg1:#ffffff;--bg2:#f0f4fa;
  --green:#1a7f37;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:192px;height:64px;overflow:hidden;background:transparent!important}
/* 关键：渐变必须画在 .card 子元素上，不能画在 body——body 背景会传播到根 canvas，
   传播后无视 border-radius，整个画布（含圆角外）都被涂满 → 色键透明失效（直角）。 */
body{display:flex;align-items:center}
.card{
  width:192px;height:64px;border-radius:18px;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  border:1px solid rgba(88,166,255,.28);
  display:flex;align-items:center;padding:0 6px 0 8px;gap:6px;cursor:default;
  transition:background .3s ease,color .3s ease,border-color .3s ease;
}
html[data-theme="light"] .card{border-color:rgba(47,111,237,.35)}
.card.on{border-color:rgba(63,185,80,.45)}
/* ---- 左：开关按钮（图标点击切换） ---- */
.sig{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;
     border-radius:12px;cursor:pointer;transition:background .15s}
.sig:hover{background:rgba(88,166,255,.12)}
.sig svg{width:26px;height:26px;display:block;color:var(--accent)}
.card.on .sig svg{color:var(--green)}
.ring{position:absolute;inset:2px;border-radius:50%;border:2px solid transparent;pointer-events:none}
.card.on .ring{border-top-color:var(--green);animation:spin 1.6s linear infinite}
.card:not(.on) .ring{display:none}  /* 旋转圈只在开机时出现 */
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- 中：信息两行（上下行各占一行，不挤） ---- */
.info{flex:1;min-width:0;line-height:1.35}
.row1{display:flex;align-items:baseline;gap:4px}
.n{font-size:16px;font-weight:700;color:var(--n)}
.nlabel{font-size:10px;color:var(--muted)}
.down,.up{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.down b{color:#3fb950;font-weight:600}
.up b{color:#d29922;font-weight:600}
html[data-theme="light"] .down b{color:#1a7f37}
html[data-theme="light"] .up b{color:#9a6700}
/* ---- 右：展开按钮 ---- */
.exp{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
     cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.exp:hover{background:rgba(88,166,255,.12);color:var(--accent)}
.exp svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="sig" id="toggle" title="点击 开/关 热点">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <path d="M4 11.5a12 12 0 0 1 16 0"/><path d="M7.5 15a7 7 0 0 1 9 0"/>
      <circle cx="12" cy="18.5" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
    <div class="ring"></div>
  </div>
  <div class="info">
    <div class="row1"><span class="n" id="n">0</span><span class="nlabel">台在线</span></div>
    <div class="down" id="down">↓ <b>0 B/s</b></div>
    <div class="up" id="up">↑ <b>0 B/s</b></div>
  </div>
  <div class="exp" id="expand" title="返回主界面">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 6 15 12 9 18"/>
    </svg>
  </div>
</div>
<script>
const fmt = (n) => {
  let f = n, u = "B";
  for (const x of ["KB","MB","GB"]) { if (f < 1024) break; f /= 1024; u = x; }
  return (f < 10 && u !== "B" ? f.toFixed(1) : Math.round(f)) + " " + u;
};
// 打开瞬间先取一次主题（不等 1.5s 轮询），避免闪深色
async function initTheme() {
  try {
    const t = await window.pywebview.api.get_theme();
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  } catch (e) {}
}
let dragging = false;
async function tick() {
  if (dragging) { setTimeout(tick, 1500); return; }  // 拖拽中跳过，避免 API 调用打断 move
  try {
    const st = await window.pywebview.api.mini_state();
    document.getElementById("card").classList.toggle("on", !!st.active);
    document.documentElement.setAttribute("data-theme", st.theme === "light" ? "light" : "dark");
    document.getElementById("n").textContent = st.online || 0;
    document.getElementById("down").innerHTML = "↓ <b>" + fmt(st.down || 0) + "</b>";
    document.getElementById("up").innerHTML = "↑ <b>" + fmt(st.up || 0) + "</b>";
  } catch (e) {}
  setTimeout(tick, 1500);
}
// ---- 交互：左图标=开关，右按钮=回主界面 ----
document.getElementById("toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  window.pywebview.api.mini_toggle();
});
document.getElementById("expand").addEventListener("click", (e) => {
  e.stopPropagation();
  window.pywebview.api.mini_restore_main();
});
// ---- 拖拽：JS 只报增量，后端 move_mini 负责 GetWindowPos + SetWindowPos ----
let ox = 0, oy = 0, pending = 0;
window.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (e.target.closest(".sig") || e.target.closest(".exp")) return;  // 按钮不触发拖拽
  dragging = true;
  ox = e.screenX; oy = e.screenY;
  const mv = (ev) => {
    const dx = ev.screenX - ox, dy = ev.screenY - oy;
    if (dx === 0 && dy === 0) return;
    ox = ev.screenX; oy = ev.screenY;
    // 合并高频 mousemove：上一条还没被后端消化时只累计增量
    pending += 1;
    window.pywebview.api.move_mini(dx, dy).then(() => { pending -= 1; });
  };
  const up = () => {
    dragging = false;
    window.removeEventListener("mousemove", mv);
    window.removeEventListener("mouseup", up);
  };
  window.addEventListener("mousemove", mv);
  window.addEventListener("mouseup", up);
});
window.addEventListener("pywebviewready", () => { initTheme(); tick(); });
</script>
</body>
</html>
