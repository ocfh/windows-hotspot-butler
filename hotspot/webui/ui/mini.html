<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- WinForms Chromium 透明窗口：html/body 必须背景透明，圆角画在 body 上 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{background:transparent !important;width:190px;height:64px;overflow:hidden}
body{
  border-radius:16px;
  --text:#eaf0ff;--muted:#8b949e;--n:#58A6FF;--accent:#58A6FF;
  --bg:linear-gradient(135deg,rgba(17,21,31,.97),rgba(28,35,54,.97));
  --border:rgba(88,166,255,.28);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);
  background:var(--bg);
  border:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:9px;cursor:default;
  transition:background .3s ease,color .3s ease,border-color .3s ease;
}
html[data-theme="light"] body{
  --text:#1c2333;--muted:#5d6a7e;--n:#2f6fed;
  --bg:linear-gradient(135deg,rgba(255,255,255,.97),rgba(240,244,250,.97));
  --border:rgba(47,111,237,.35);
}
body.on{border-color:rgba(63,185,80,.45)}
.sig{position:relative;width:32px;height:32px;flex:none;display:grid;place-items:center}
.sig svg{width:32px;height:32px;display:block}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
body.on .ring{border-top-color:#3fb950;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{flex:1;min-width:0;line-height:1.3}
.row1{display:flex;align-items:baseline;gap:5px}
.n{font-size:18px;font-weight:700;color:var(--n)}
.nlabel{font-size:10.5px;color:var(--muted)}
.rates{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{flex:none;width:44px;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <div class="sig">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" style="color:var(--accent)">
      <path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.4a6 6 0 0 1 7 0"/>
      <circle cx="12" cy="20" r="1.3" fill="currentColor" stroke="none"/>
    </svg>
    <div class="ring"></div>
  </div>
  <div class="info">
    <div class="row1"><span class="n" id="n">0</span><span class="nlabel">台在线</span></div>
    <div class="rates" id="rates">↓ 0 B/s · ↑ 0 B/s</div>
  </div>
  <div class="hint">双击开关<br>右键返回</div>
<script>
const fmt = (n) => {
  let f = n, u = "B";
  for (const x of ["KB","MB","GB"]) { if (f < 1024) break; f /= 1024; u = x; }
  return (f < 10 && u !== "B" ? f.toFixed(1) : Math.round(f)) + " " + u;
};
async function tick() {
  try {
    const st = await window.pywebview.api.mini_state();
    document.body.classList.toggle("on", !!st.active);
    document.documentElement.setAttribute("data-theme", st.theme === "light" ? "light" : "dark");
    document.getElementById("n").textContent = st.online || 0;
    document.getElementById("rates").textContent =
      "↓ " + fmt(st.down || 0) + " · ↑ " + fmt(st.up || 0);
  } catch (e) {}
  setTimeout(tick, 1500);
}
document.addEventListener("dblclick", () => window.pywebview.api.mini_toggle());
document.addEventListener("contextmenu", (e) => { e.preventDefault(); window.pywebview.api.mini_restore_main(); });
window.addEventListener("pywebviewready", tick);
</script>
</body>
</html>
