<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Microsoft YaHei",monospace;
    background:#0d0d0f;color:#f2f2f2;
  }
  main{width:100%;max-width:460px;border:1px solid #2a2a2e;border-radius:6px;padding:30px 28px;background:#131316}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;
       margin-right:8px;box-shadow:0 0 0 4px rgba(74,222,128,.14)}
  .ssid{font-size:12px;color:#8a8a94;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  h1{font-size:19px;font-weight:600;margin-bottom:10px;line-height:1.5}
  .sub{font-size:13px;color:#8a8a94;line-height:1.75;margin-bottom:22px}
  pre{
    font-family:inherit;font-size:12.5px;line-height:1.85;color:#b9b9c3;
    border-left:2px solid #4ade80;padding:2px 0 2px 14px;margin-bottom:26px;
    white-space:pre-wrap;word-break:break-word;
  }
  button{
    width:100%;padding:13px;background:transparent;color:#f2f2f2;cursor:pointer;
    border:1px solid #3a3a40;border-radius:4px;font-family:inherit;font-size:14px;
    transition:border-color .15s ease,background .15s ease;
  }
  button:hover{border-color:#4ade80;background:rgba(74,222,128,.07)}
  .meta{margin-top:20px;font-size:11px;color:#5c5c66;display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
  <main>
    <div class="ssid"><span class="dot"></span>{{ssid}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <pre>{{notice}}</pre>
    <form method="post" action="/accept">
      <button type="submit">{{button}} →</button>
    </form>
    <div class="meta"><span>clients {{clients}}</span><span>gw {{gateway}}</span><span>{{time}}</span></div>
  </main>
</body>
</html>
