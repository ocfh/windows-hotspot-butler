<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#062a33;
    background:linear-gradient(150deg,#e8fff9 0%,#b9f1e4 45%,#7fd8e8 100%);
  }
  .card{
    width:100%;max-width:500px;background:#fff;border-radius:24px;overflow:hidden;
    box-shadow:0 26px 60px rgba(8,90,110,.22);
  }
  .head{padding:30px 32px 26px;background:linear-gradient(135deg,#0e9aa7,#3dd6b4);color:#fff}
  .head .tag{font-size:12px;opacity:.9;letter-spacing:.08em;text-transform:uppercase}
  .head h1{font-size:23px;margin-top:8px;line-height:1.4}
  .head p{margin-top:8px;font-size:13.5px;opacity:.92;line-height:1.6}
  .body{padding:26px 32px 30px}
  ul{list-style:none;margin-bottom:22px}
  li{
    position:relative;padding:9px 0 9px 26px;font-size:13.5px;line-height:1.75;color:#3c5b63;
    border-bottom:1px dashed #e3f1ef;
  }
  li:last-child{border-bottom:0}
  li::before{
    content:"";position:absolute;left:4px;top:16px;width:9px;height:9px;border-radius:50%;
    background:#3dd6b4;box-shadow:0 0 0 4px rgba(61,214,180,.2);
  }
  button{
    width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:700;
    color:#fff;background:linear-gradient(135deg,#0e9aa7,#25c39a);
    transition:filter .16s ease,transform .16s ease;
  }
  button:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .meta{margin-top:18px;text-align:center;font-size:12px;color:#7fa0a6}
  .meta b{color:#0e9aa7}
  @media(max-width:420px){.head,.body{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="tag">{{ssid}}</div>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </div>
    <div class="body">
      <ul>{{notice_li}}</ul>
      <form method="post" action="/accept">
        <button type="submit">{{button}}</button>
      </form>
      <div class="meta">当前在线 <b>{{clients}}</b> 台 · 网关 <b>{{gateway}}</b> · {{time}}</div>
    </div>
  </div>
</body>
</html>
