<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Windows Hotspot Butler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B8CFF"/>
      <stop offset="1" stop-color="#0A4ED6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- White shield with the WiFi punched out, so the blue tile shows through -->
    <mask id="cut">
      <path d="M 256 76 L 416 132 L 416 264 C 416 384 342 440 256 468 C 170 440 96 384 96 264 L 96 132 Z" fill="#FFFFFF"/>
      <g fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round">
        <path d="M 166.0 226.8 A 140 140 0 0 1 346.0 226.8"/>
        <path d="M 194.93 261.23 A 95 95 0 0 1 317.07 261.23"/>
        <path d="M 223.86 295.70 A 50 50 0 0 1 288.14 295.70"/>
      </g>
      <circle cx="256" cy="334" r="16" fill="#000000"/>
    </mask>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#sheen)"/>

  <!-- White shield (WiFi shows the blue gradient through the cut-outs) -->
  <path d="M 256 76 L 416 132 L 416 264 C 416 384 342 440 256 468 C 170 440 96 384 96 264 L 96 132 Z"
        fill="#FFFFFF" mask="url(#cut)"/>
  <path d="M 256 76 L 416 132 L 416 264 C 416 384 342 440 256 468 C 170 440 96 384 96 264 L 96 132 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
</svg>
